name: Patch Dealercom Price Guard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch dealercom price guard
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('run.js')
          source = path.read_text()

          old = '    const priceNumber = cleanPrice(vehicle.price_text);'
          new = '\n'.join([
              '    const rawPriceNumber = cleanPrice(vehicle.price_text);',
              '    const priceNumber = rawPriceNumber && rawPriceNumber >= 10000 ? rawPriceNumber : null;',
              '    const safePriceText = priceNumber ? vehicle.price_text : "";',
              '    const safePriceStatus = priceNumber ? (vehicle.price_status || "priced") : "unknown";'
          ])

          if old in source:
              source = source.replace(old, new, 1)
              print('Added dealercom final price guard')
          elif 'const safePriceText = priceNumber ? vehicle.price_text : "";' in source:
              print('dealercom final price guard already exists')
          else:
              raise SystemExit('Could not find dealercom priceNumber line')

          old2 = '\n'.join([
              '      low_price: priceNumber,',
              '      high_price: priceNumber,',
              '      price_text: vehicle.price_text || "",',
              '      price_status: vehicle.price_status || "unknown",'
          ])
          new2 = '\n'.join([
              '      low_price: priceNumber,',
              '      high_price: priceNumber,',
              '      price_text: safePriceText,',
              '      price_status: safePriceStatus,'
          ])

          if old2 in source:
              source = source.replace(old2, new2, 1)
              print('Updated dealercom row price fields')
          elif 'price_text: safePriceText,' in source:
              print('dealercom row price fields already patched')
          else:
              raise SystemExit('Could not find dealercom row price fields')

          path.write_text(source)
          PY

      - name: Check syntax
        run: node --check run.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add dealercom price guard"
            git push
          fi
