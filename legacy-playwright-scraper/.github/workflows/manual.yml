name: Manual Scrape

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "dealer, group, or all"
        required: true
        default: "dealer"

      scraper_store_id:
        description: "Example: aaron_cdjr"
        required: false

      group_id:
        description: "Example: aaron_automotive_group"
        required: false

      run_id:
        description: "Base44 ScraperRunLog run_id"
        required: false

      scraper_run_log_id:
        description: "Base44 ScraperRunLog record ID"
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BASE44_CONFIG_URL: https://app.mktgtrends.com/functions/getScraperConfig
      BASE44_UPDATE_SCRAPER_RUN_LOG_URL: https://app.mktgtrends.com/functions/updateScraperRunLog
      SCRAPER_API_SECRET: ${{ secrets.SCRAPER_API_SECRET }}

    steps:
      - name: Test Base44 scraper config
        run: |
          curl -i \
            -H "X-Scraper-Secret: $SCRAPER_API_SECRET" \
            "$BASE44_CONFIG_URL"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx playwright install chromium

      - run: node run.js
        env:
          RUN_TYPE: ${{ github.event.inputs.run_type }}
          SCRAPER_STORE_ID: ${{ github.event.inputs.scraper_store_id }}
          GROUP_ID: ${{ github.event.inputs.group_id }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          SCRAPER_RUN_LOG_ID: ${{ github.event.inputs.scraper_run_log_id }}
          BASE44_CONFIG_URL: ${{ env.BASE44_CONFIG_URL }}
          BASE44_UPDATE_SCRAPER_RUN_LOG_URL: ${{ env.BASE44_UPDATE_SCRAPER_RUN_LOG_URL }}
          SCRAPER_API_SECRET: ${{ env.SCRAPER_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
